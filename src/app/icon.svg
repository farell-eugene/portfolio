<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Browser-tab icon: just the letters "FE" in the site's blue → violet gradient,
       drawn as shapes (not text) so they look identical on every device; transparent background -->
  <defs>
    <linearGradient id="fe" gradientUnits="userSpaceOnUse" x1="4" y1="12" x2="60" y2="52">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.5" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <g fill="url(#fe)">
    <!-- F -->
    <rect x="4" y="12" width="9" height="40" rx="1.5"/>
    <rect x="4" y="12" width="24" height="9" rx="1.5"/>
    <rect x="4" y="28" width="20" height="8" rx="1.5"/>
    <!-- E -->
    <rect x="35" y="12" width="9" height="40" rx="1.5"/>
    <rect x="35" y="12" width="25" height="9" rx="1.5"/>
    <rect x="35" y="28" width="21" height="8" rx="1.5"/>
    <rect x="35" y="43" width="25" height="9" rx="1.5"/>
  </g>
</svg>
